version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: avss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avss_user
      POSTGRES_PASSWORD: avss_password
      POSTGRES_DB: avss_db
    ports:
      - "5432:5432"
    volumes:
      - avss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avss_user -d avss_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: avss_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://avss_user:avss_password@postgres:5432/avss_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: avss_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  avss_postgres_data:
